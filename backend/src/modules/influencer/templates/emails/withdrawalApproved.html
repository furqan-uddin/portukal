<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Withdrawal Payout Approved</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
        .card { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .badge { display: inline-block; background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700; padding: 4px 12px; rounded: 9999px; }
        .amount { font-size: 32px; font-weight: 900; color: #059669; margin: 16px 0; }
        .footer { font-size: 12px; color: #94a3b8; margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Payout Approved</span>
        <h2>Your Withdrawal Request Has Been Approved!</h2>
        <p>Admin has approved your withdrawal payout request.</p>
        <div class="amount">₹{{amount}}</div>
        <p><strong>Payment Reference:</strong> {{paymentReference}}</p>
        <p>Funds will be credited to your registered payout account shortly.</p>
        <div class="footer">
            Porutkal Marketplace Payout Engine &copy; 2026
        </div>
    </div>
</body>
</html>
